name: generate languages metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: plugin.languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_recent_load: 400
          plugin_languages_recent_days: 30
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          config_css: |
            :root{--bg:transparent}svg{background:transparent!important}

      - name: organize into subfolder
        shell: bash
        run: |
          mkdir -p output-files/metrics
          mv plugin.*.svg output-files/metrics/

      - name: push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output-files
          publish_branch: output
          keep_files: true
